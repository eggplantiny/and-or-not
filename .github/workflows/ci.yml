name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Metadata
        run: cargo metadata --format-version 1 --no-deps --locked

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Stage 0 conformance
        run: cargo test -p aon-sim --test conformance_stage0 --locked

      - name: Deterministic fuzz regression corpus
        run: cargo test -p aon-fuzz-harness --locked

      - name: Cross-host determinism
        run: cargo test -p aon-app --test cross_host_determinism --locked

      - name: Canonical core dependency boundary
        shell: bash
        run: |
          tree_output="$(cargo tree -p aon-sim --edges all --prefix none --locked)"
          printf '%s\n' "$tree_output"
          if printf '%s\n' "$tree_output" | grep -E '^(bevy|winit|wgpu)($|[-_ ])'; then
            echo 'aon-sim must not depend on Bevy, winit, or wgpu' >&2
            exit 1
          fi

      - name: Reject Windows zone metadata
        shell: bash
        run: |
          if find . -type f -name '*:Zone.Identifier' -print -quit | grep -q .; then
            echo 'Zone.Identifier metadata must not be tracked' >&2
            exit 1
          fi
