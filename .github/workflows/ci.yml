name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Metadata
        run: cargo metadata --format-version 1 --no-deps --locked

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Stage 0 technical gate
        shell: pwsh
        run: ./scripts/stage0-technical-gate.ps1

      - name: S1-M0 technical gate
        shell: pwsh
        run: ./scripts/s1-m0-technical-gate.ps1

      - name: S1-M1 technical gate
        shell: pwsh
        run: ./scripts/s1-m1-technical-gate.ps1

      - name: Deterministic fuzz regression corpus
        run: cargo test -p aon-fuzz-harness --locked

      - name: Cross-host determinism
        run: cargo test -p aon-app --test cross_host_determinism --locked

      - name: Reject Windows zone metadata
        shell: bash
        run: |
          if find . -type f -name '*:Zone.Identifier' -print -quit | grep -q .; then
            echo 'Zone.Identifier metadata must not be tracked' >&2
            exit 1
          fi

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Native workspace check
        run: cargo check --workspace --all-targets --locked

      - name: Native strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Native workspace tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Native app link
        run: cargo build -p aon-app --locked

      - name: Native Stage 0 technical gate
        shell: pwsh
        run: ./scripts/stage0-technical-gate.ps1

      - name: Native S1-M0 technical gate
        shell: pwsh
        run: ./scripts/s1-m0-technical-gate.ps1

      - name: Native S1-M1 technical gate
        shell: pwsh
        run: ./scripts/s1-m1-technical-gate.ps1
