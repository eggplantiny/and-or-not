[workspace]
members = [
    "crates/aon-sim",
    "crates/aon-fuzz-harness",
    "apps/aon-app",
    "apps/aon-headless",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_ui_render",
    "bevy_winit",
    "default_app",
    "x11",
] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = "=0.44.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
