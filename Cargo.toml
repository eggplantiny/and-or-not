[workspace]
members = [
    "crates/aon-sim",
    "apps/aon-app",
    "apps/aon-headless",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["default_app", "bevy_winit", "x11"] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
